<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roadside Help</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Roadside Assistance</h1>

  <div class="container">

    <input id="name" placeholder="Your Name" />
    <input id="issue" placeholder="What’s the problem?" />

    <button onclick="sendRequest()">Request Help</button>

    <p id="status"></p>

  </div>
 <h2>Your Current Location</h2>
<div id="map"></div>

<script>
navigator.geolocation.getCurrentPosition((pos) => {
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;

  document.getElementById("map").innerHTML = `
    <iframe
      width="100%"
      height="300"
      style="border:0"
      loading="lazy"
      src="https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed">
    </iframe>
  `;
});
</script> 

  <script>
    const API = "https://roadside-server.onrender.com";

    async function sendRequest() {
      const name = document.getElementById("name").value;
      const issue = document.getElementById("issue").value;

      if (!name || !issue) {
        document.getElementById("status").innerText = "Please fill in all fields";
        return;
      }

      try {
        const res = await fetch(`${API}/request`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ name, issue })
        });

        const data = await res.json();

        document.getElementById("status").innerText = "Request sent successfully!";

        document.getElementById("name").value = "";
        document.getElementById("issue").value = "";

      } catch (err) {
        console.error(err);
        document.getElementById("status").innerText = "Error sending request";
      }
    }
  </script>

</body>
</html>
