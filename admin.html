<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin Dashboard</title>

  <!-- CSS MUST GO HERE -->
  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <h1>Admin Dashboard</h1>

  <div id="list"></div>

  <script>
    async function loadRequests() {
      const res = await fetch("https://roadside-server.onrender.com/admin/requests");
      const data = await res.json();

      document.getElementById("list").innerHTML = data.map(r => `
        <div class="job">
          <p><b>Name:</b> ${r.name}</p>
          <p><b>Issue:</b> ${r.issue}</p>
          <p class="time"><b>Time:</b> ${r.time}</p>
        </div>
      `).join("");
    }

    loadRequests();
    setInterval(loadRequests, 5000);
  </script>

</body>
</html>
